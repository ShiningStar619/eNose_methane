<title>eNose Methane — Screened Papers Reader</title>
<style>
:root {
  --bg: #f7f4ef;
  --panel: #fffdf9;
  --ink: #1c1917;
  --muted: #78716c;
  --line: #e7e0d5;
  --accent: #0f766e;
  --accent-soft: #ccfbf1;
  --direct: #0f766e;
  --supporting: #a16207;
  --excluded: #b91c1c;
  --side: 320px;
  --serif: "IBM Plex Serif", "Sarabun", Georgia, serif;
  --sans: "IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: var(--side) 1fr; height: 100vh; }
.side {
  border-right: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
.brand { padding: 1.1rem 1rem 0.6rem; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 1.05rem; font-family: var(--serif); letter-spacing: -0.02em; }
.brand p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
.controls { padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); display: grid; gap: 0.5rem; }
.controls input[type=search] {
  width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; font: inherit;
}
.filters { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.filters label {
  font-size: 0.75rem; padding: 0.25rem 0.55rem; border-radius: 999px;
  border: 1px solid var(--line); background: #fff; cursor: pointer; user-select: none;
}
.filters label.on-direct { background: #ecfdf5; border-color: #99f6e4; color: var(--direct); }
.filters label.on-supporting { background: #fffbeb; border-color: #fde68a; color: var(--supporting); }
.filters label.on-excluded { background: #fef2f2; border-color: #fecaca; color: var(--excluded); }
.list { overflow: auto; flex: 1; padding: 0.4rem; }
.card {
  width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
  border-radius: 10px; padding: 0.7rem 0.75rem; cursor: pointer; font: inherit; color: inherit;
}
.card:hover { background: #f5f1ea; }
.card.active { background: var(--accent-soft); border-color: #99f6e4; }
.card .meta { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.25rem; flex-wrap: wrap; }
.badge {
  font-size: 0.68rem; font-weight: 600; padding: 0.12rem 0.4rem; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.03em;
}
.badge.direct { background: #ccfbf1; color: var(--direct); }
.badge.supporting { background: #fef3c7; color: var(--supporting); }
.badge.excluded { background: #fee2e2; color: var(--excluded); }
.badge.pdf { background: #e0e7ff; color: #3730a3; }
.badge.id { background: #f5f5f4; color: #44403c; }
.card .title { font-size: 0.86rem; line-height: 1.35; font-weight: 600; }
.card .sub { margin-top: 0.2rem; font-size: 0.75rem; color: var(--muted); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 0.25rem; padding: 0.65rem 1rem 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab {
  border: 0; background: transparent; padding: 0.55rem 0.85rem; border-radius: 8px 8px 0 0;
  font: inherit; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.view { overflow: auto; padding: 1.25rem 1.5rem 3rem; flex: 1; }
.empty { color: var(--muted); padding: 2rem 0; }
.paper-head h2 { margin: 0 0 0.4rem; font-family: var(--serif); font-size: 1.45rem; line-height: 1.3; }
.paper-head .byline { color: var(--muted); margin: 0 0 1rem; font-size: 0.92rem; }
.kv { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.35rem 0.75rem; margin: 1rem 0 1.25rem; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.box {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 1rem 1.1rem; margin: 0.9rem 0;
}
.box h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
.box p, .box pre { margin: 0; white-space: pre-wrap; line-height: 1.55; font-size: 0.92rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0 0.25rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.75rem;
  border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  text-decoration: none; font-size: 0.85rem;
}
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.tagrow { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
.tag { font-size: 0.72rem; padding: 0.15rem 0.45rem; border-radius: 6px; background: #f5f5f4; color: #57534e; }
.lit h1, .lit h2, .lit h3 { font-family: var(--serif); }
.lit h1 { font-size: 1.4rem; }
.lit h2 { font-size: 1.15rem; margin-top: 1.6rem; border-top: 1px solid var(--line); padding-top: 1rem; }
.lit h3 { font-size: 1rem; }
.lit p { line-height: 1.65; }
.lit blockquote { border-left: 3px solid var(--accent); margin: 0.8rem 0; padding: 0.2rem 0.8rem; color: var(--muted); }
.lit code { font-size: 0.85em; background: #f5f5f4; padding: 0.05rem 0.3rem; border-radius: 4px; }
.stats { font-size: 0.75rem; color: var(--muted); padding: 0.5rem 1rem; border-top: 1px solid var(--line); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>

he Yangtze River Basin\n\nAUTHORS\nQinjing Zhang, Weijia Wen, Yanhua Zhuang, Liang Zhang, Limei Zhai, Sisi Li, Hongbin Liu, Yun Du\n\nJOURNAL\nJournal of Environmental Management, Volume 393, October 2025, Article 127132\n\nABSTRACT (PubMed / ScienceDirect)\nAccurate and high-frequency monitoring of methane (CH4) from rice paddies is crucial for effective carbon emission control but remains challenging due to fluctuant emissions and complex field environments. This study proposed a new in-situ high-frequency CH4 measurement method based on machine learning and sensor-measurable water-soil-air environment factors. The results show that:\n(1) soil and paddy water serve as critical media influencing CH4 production and transportation, with paddy water depth (Hpw), soil electrical conductivity (EC), and soil temperature (Ts) being significantly positively correlated with CH4 emission flux, while soil redox potential (Eh) had a negative effect (p \u003c 0.05).\n(2) The decision tree (DTR) showed the best accuracy for CH4 inversion, with soil factors being the optimal input group (R2 = 0.84), which was superior to water-soil (0.83), water-soil-air (0.55), and air-soil (0.45) groups; Eh, EC, soil pH, and Ts are the essential input variables (R2 \u003e 0.80).\n(3) Combining the immediacy of multi-sensor detection and the accuracy of machine learning, the new method demonstrates notable advantages in high frequency, high accuracy, synchronous multiparameter monitoring, and low cost. This method enables the real-time monitoring and control of CH4 emission from paddy fields, thereby offering new perspectives for CH4 monitoring in small water bodies (such as ditches, ponds, lakes, etc.).\n\nHIGHLIGHTS\n- Develop a new in-situ high-frequency CH4 measurement method for rice paddies.\n- The new method combines the advantages of sensor and decision tree algorithm.\n- Sensor-measured water-soil-air factors are selected to simulate CH4 emission.\n\nSTUDY AREA & DATA (ScienceDirect preview)\n- Experiment: June–September 2022 and 2024\n- Sites: Liuzhou village (112.62°E, 30.39°N), Qianjiang City; Wenan town (111.82°E, 30.53°N), Zhijiang City, Hubei Province, China\n- Context: Yangtze River Basin — largest paddy area in China (~68.7% of national rice area)\n- Two typical crop rotation systems\n\nMOTIVATION (Introduction summary)\n- Rice paddies ≈ 48% of agricultural CH4 emissions (flooded conditions)\n- CH4 processes: production, oxidation, transport — driven by soil properties, water/fertilizer management, tillage, climate\n- Limitations of existing methods:\n  * Chamber: labor-intensive, low temporal resolution\n  * Models (CH4MOD, DNDC): complex calibration, limited temporal resolution\n  * Remote sensing: cloud/rain gaps during rice season (Jun–Oct)\n- Proposed: sensor immediacy + ML accuracy for CH4 monitoring\n\nKEY FINDINGS — factor relevance\n- Paddy water depth and soil EC significantly positively correlated with CH4 flux\n- Soil Eh negatively correlated\n- Soil + paddy surface water are critical for CH4 production and transport\n\nML COMPARISON\n- Five ML algorithms evaluated; Decision Tree Regressor (DTR) best\n- Input groups (R2):\n  * Soil only: 0.84 (best)\n  * Water-soil: 0.83\n  * Water-soil-air: 0.55\n  * Air-soil: 0.45\n- Key variables: Eh, EC, soil pH, Ts (each R2 \u003e 0.80 when used individually)\n\nCONCLUSION (ScienceDirect preview)\nAmong five evaluated ML algorithms, DTR exhibited highest accuracy (R2 = 0.84) with soil factors as input. Emphasizes critical roles of soil and paddy surface water; Eh, EC, soil pH, and Ts are essential.\n\nFUNDING\n- National Key R&D Program of China [2022YFD1700700]\n- Hubei Provincial Natural Science Foundation [2024AFA020]\n- Young Top-notch Talent Cultivation Program of Hubei Province\n\nKEYWORDS\nIn-situ monitoring; Machine learning; Methane (CH4); Paddy fields; Water-soil-air environment factors\n", "2024_IoT_lowcost_GHG_monitoring_paddy_regions": "# Metadata (PDF not downloaded automatic  โดยชี้ว่าข้าวเป็นอาหารหลักของมากกว่าครึ่งหนึ่งของประชากรโลก และการปลูกข้าวในสภาพน้ำท่วมขังสร้างสภาพที่เหมาะสมต่อการผลิตและปล่อย CH₄ งานสังเคราะห์ด้านการจัดการน้ำและปุ๋ยในนาข้าว [17] แสดงให้เห็นว่ารูปแบบการจัดการนา โดยเฉพาะการควบคุมระดับน้ำ มีผลอย่างมีนัยสำคัญต่อการปล่อย CH₄ การศึกษาเรื่องพันธุ์ข้าวและปัจจัยทางเกษตร [20] ยืนยันว่าชนิดผลิตภัณฑ์ พันธุ์ข้าว และมาตรการทางเกษตรมีผลต่อปริมาณการปล่อยก๊าซ\n\nปัจจัยทางดินและชีวภาพก็มีบทบาทสำคัญ งานวิจัยระดับ rhizosphere ชี้ว่าการพัฒนารากข้าวและสภาพดินรอบรากส่งผลต่อการปล่อย CH₄ [18] ในขณะที่ carbon availability และค่า pH ของดินเป็นตัวควบคุมสำคัญของการปล่อย CH₄ ตาม gradient อุณหภูมิ [19] โมเดลกระบวนการเช่น CH4MOD [16] ถูกพัฒนาเพื่อประมาณการปล่อย CH₄ จากนาข้าวในระดับภูมิภาคและโลก แต่การประมาณระดับ macro ยังไม่เพียงพอสำหรับการติดตามการเปลี่ยนแปลงในระดับแปลงนา\n\nCH₄ จากนาข้าวมี **ความผันผวนสูง** ทั้งตามฤดูกาล ระยะเจริญเติบโตของข้าว และช่วงเวลาในวัน [14] ดังนั้นการติดตามการปล่อยก๊าซเพื่อประเมินมาตรการลด emission หรือเพื่อ validate เครื่องมือวัดใหม่ จำเป็นต้องอาศัยการวัดซ้ำในช่วงเวลาที่เหมาะสม ไม่ใช่การสรุปจากค่าเฉลี่ยเพียงครั้งเดียว [4], [17]\n\n---\n\n## 4.2.2 วิธี chamber ร่วมกับก๊าซโครมาโทกราฟี (วิธีอ้างอิง)\n\nการใช้ **static chamber** ร่วมกับ **gas chromatography (GC-FID)** สำหรับ CH₄ ยังถือเป็น **วิธีอ้างอิง (ground truth)** ที่ได้รับการยอมรับกว้างขวางในการวัดการปล่อยก๊าซเรือนกระจกจากดินเกษตรกรรม [6] Zaman et al. [6] นำเสนอระเบียบวิธีการวัดการปล่อยก๊าซเรือนกระจกจากดินเกษตรกรรมด้วยเทคนิค non-isotopic รวมถึงการออกแบบ chamber การเก็บตัวอย่าง และการวิเคราะห์ด้วย GC-FID สำหรับ CH₄\n\nMumu et al. [7] ทบทวนความก้าวหน้าทางวิธีวิทยาในการวัดก๊าซเรือนกระจกจากเกษตรกรรม และสรุปว่า chamber–GC ยังให้ **ความแม่นยำสูง** แต่มีข้อจำกัดด้าน **ต้นทุน แรงงาน และความถี่ในการเก็บตัวอย่าง (sampling)** การเก็บข้อมูลทำได้ไม่บ่อย จึงติดตามการเปลี่ยนแปลงตลอดฤดูปลูกได้ยาก [7] Borhan และ Khanaum [9] เปรียบเทียบเซ็นเซอร์และวิธีการวัดก๊าซเรือนกระจกจากฟาร์มปศุสัตว์ แม้บริบทจะต่างจากนาข้าว แต่หลักการของ chamber และ GC สำหรับการวัด **flux** สามารถนำมาประยุกต์กับนาข้าวได้\n\nงานวิจัยนี้กำหนดให้ chamber ร่วมกับ GC-FID เป็นวิธีอ้างอิงสำหรับการฝึกและตรวจสอบแบบจำลอง eNose โดยค่าความเข้มข้น CH₄ (ppm) จาก GC จะใช้เป็น ground truth เทียบกับค่าที่ได้จากระบบ eNose ภายใต้ขอบเขตการศึกษา [6], [7]\n\n---\n\n## 4.2.3 วิธีวัดอื่นและการประเมิน CH₄ ในนาข้าว\n\nนอกจาก chamber–GC ยังมีวิธีและแนวทางอื่นสำหรับการตรวจวัดและประเมิน CH₄ จากนาข้าว ซึ่งแต่ละวิธีมีข้อดีและข้อจำกัดต่างกัน\n\n### สเปกโทรสโกปีและเทคโนโลยีตรวจจับระดับสูง\n\nTyagi et al. [8] ทบทวนความก้าวหน้าของเทคโนโลยีการตรวจจับมีเทน รวมถึง TDLAS, CRDS และ FTIR ที่วัดได้ในระดับ ppm ถึง ppb วิธีเหล่านี้ให้ความแม่นยำสูงและตอบสนองเร็ว เหมาะกับงานในห้องแล็บหรือสถานีตรวจวัดคงที่ แต่มี **ต้นทุนสูง** ต้องการการตั้งค่าที่ซับซ้อน และไม่เหมาะกับการติดตั้งหลายจุดในแปลงนาขนาดเล็กหรือการติดตามแบบต่อเนื่องตลอดฤดูปลูก [8] Vo et al. [21] เปรียบเทียบเทคนิค TGA กับ GC ในการวัดมีเทนจากดินเกษตรกรรม ซึ่งแสดงให้เห็นว่ามีทางเลือกด้านเครื่องมือวิเคราะห์หลายแบบ แต่การเลือกใช้ยังขึ้นกับความแม่นยำ ต้นทุน และบริบทการใช้งาน\n\n### การสังเกตจากระยะไกลและ machine learning ระดับภูมิภาค\n\nการสังเกตจากดาวเทียมและ UAV ช่วยครอบคลุมพื้นที่กว้างได้ แต่ความละเอียดเชิงพื้นที่มัก **ไม่ถึงระดับรายแปลงนา** โดยตรง [8] Xu et al. [22] นำเสนอแนวทาง AI/ML ร่วมกับ remote sensing สำหรับประเมิน CH₄ จากนาข้าว ซึ่งเหมาะกับการประเมินในระดับภูมิภาคมากกว่าการติดตาม real-time ในแปลงเดียว\n\n### เซ็นเซอร์ต้นทุนต่ำและระบบภาคสนามในนาข้าว\n\nRajasekar และ Selvi [5] ศึกษาการปล่อยก๊าซเรือนกระจกจากนาข้าวสู่บรรยากาศใกล้พื้นผิว โดยติดตั้ง **ระบบ chamber อัตโนมัติ** พร้อมเซ็นเซอร์ **MQ4** และ **TGS2611** สำหรับ CH₄ ผลการทดลองแสดงให้เห็นว่าการใช้เซ็นเซอร์ราคาประหยัดในภาคสนามเป็นไปได้ แต่ค่าที่ได้ยังต้องอาศัยการสอบเทียบและตรวจสอบกับวิธีอ้างอิงอย่างสม่ำเสมอ [5] งานนี้มีความเกี่ยวข้องโดยตรงกับแนวทางของงานวิจัยนี้ทั้งในแง่การเลือกเซ็นเซอร์ MOS และการติดตั้งในแปลงนาข้าว อย่างไรก็ตาม งานดังกล่าวยังไม่ได้ใช้ **eNose array หลายช่องร่วมกับ ML regression** เพื่อให้ค่าความเข้มข้น ppm โดยตรง\n\n### ML จากปัจจัยสิ่งแวดล้อมในข้าวนา\n\nZhang et al. [13] เสนอวิธีวัด CH₄ แบบ in-situ ความถี่สูงในข้าวนา โดยใช้ **machine learning** กับปัจจัยน้ำ–ดิน–อากาศ (water–soil–air factors) ในบริบทลุ่มแม่น้ำแยงซี ผลการทดลองด้วย Decision Tree Regressor ให้ค่า R² สูงถึง 0.84 [13] งานนี้เป็นแนวทางที่ **ใกล้ use case ของงานวิจัยนี้มากที่สุด** ในด้านนาข้าว แต่ยัง **ไม่ได้ใช้สัญญาณจาก eNose/MOS** เป็นตัวแปรหลัก\n\nAnapalli et al. [15] ใช้ eddy covariance ประเมินผลของ alternate wetting and drying (AWD) ต่อการปล่อย CH₄ จากนาข้าว ซึ่งแสดงให้เห็นว่ามาตรการจัดการน้ำลด emission ได้ แต่วิธีนี้มีต้นทุนสูงและไม่อยู่ในขอบเขตของงานวิจัยนี้ [15]\n\n---\n\n## 4.2.4 จมูกอิเล็กทรอนิกส์และเซ็นเซอร์ MOS สำหรับมีเทน\n\n**จมูกอิเล็กทรอนิกส์ (electronic nose หรือ eNose)** เป็นระบบที่ประกอบด้วยอาเรย์เซ็นเซอร์ก๊าซหลายตัว ระบบควบคุม และซอฟต์แวร์วิเคราะห์ข้อมูล [24] เมื่อก๊าซเป้าหมายติดต่อกับพื้นผิวเซ็นเซอร์ โดยเฉพาะเซ็นเซอร์ **โลหะออกไซด์ (MOS)** ความต้านทานของวัสดุจะเปลี่ยนแปลงตามความเข้มข้นของก๊าซ สัญญาณที่ได้จึงเป็นเวกเตอร์หลายมิติ (smell print) ที่สะท้อนการตอบสนองร่วมของเซ็นเซอร์แต่ละตัว [24]\n\nDomènech-Gil et al. [10] นำเสนอแนวทาง **eNose ต้นทุนต่ำ** สำหรับการวัด CH₄ ที่ความเข้มข้นระดับบรรยากาศ โดยใช้เซ็นเซอร์ MOS หลายตัว รวมถึง **Figaro TGS2611** ควบคู่กับเซ็นเซอร์อุณหภูมิ ความชื้น และความดัน แล้วใช้ ML ชดเชยผลกระทบจากสภาพแวดล้อม ผลการทดลองในสภาพภาคสนามให้ค่า R² สูงถึง 0.91 และค่า RMSE ต่ำถึง 33 ppb ในช่วงความเข้มข้นต่ำ [10] อย่างไรก็ตาม ช่วงความเข้มข้นและบริบทการใช้งานแตกต่างจากนาข้าว จึงไม่สามารถถ่ายโอนผลลัพธ์มาใช้โดยตรงได้\n\nงานวิจัยอื่นใน corpus สนับสนุนความเป็นไปได้ของ MOS สำหรับมีเทน: Yin et al. [25] ออกแบบ eNose 7 เซ็นเซอร์เพื่อระบุ CH₄/CO ในก๊าซผสม Dobrzyniewski et al. [26] ใช้ TGS sensor array ติดตามกระบวนการที่เกี่ยวข้องกับมีเทน และงานรีวิว MOS chemiresistive [27] สรุปความก้าวหน้าของวัสดุเซ็นเซอร์สำหรับ CH₄ Ahmad et al. [12] เน้นศักยภาพของเซ็นเซอร์ MOS ต้นทุนต่ำสำหรับ precision agriculture แต่ชี้ว่าความไวต่อสารอินทรีย์ระเหยง่ายอื่น (VOC) และการเปลี่ยนแปลงของสภาพแวดล้อมยังเป็นข้อจำกัดหลักที่ต้องชดเชยด้วยแบบจำลองหลายตัวแปร [12]\n\nข้อจำกัดสำคัญของ MOS ที่ปรากฏซ้ำในวรรณกรรม ได้แก่ **cross-sensitivity** ต่อความชื้น อุณหภูมิ และก๊าซรบกวน [10], [12], [23] ดังนั้นการออกแบบระบบ eNose สำหรับนาข้าวจึงจำเป็นต้องบันทึกค่า T/H/P ควบคู่กับสัญญาณก๊าซ และใช้โปรโตคอล sampling ที่ทำให้สัญญาณเทียบกันได้ระหว่างรอบการวัด (เช่น Baseline → Measure) ซึ่งสอดคล้องกับแนวทางของโปรเจกต์ eNose Methane\n\n---\n\n## 4.2.5 Machine learning สำหรับประเมินความเข้มข้น CH₄\n\nMachine learning (ML) ถูกนำมาใช้กับ eNose และเซ็นเซอร์ก๊าซต้นทุนต่ำในสองบทบาทหลัก ได้แก่ (1) **calibration** เพื่อชดเชย cross-sensitivity และ drift ของเซ็นเซอร์ และ (2) **regression** เพื่อประเมินความเข้มข้นก๊าซเชิงตัวเลข [11], [24]\n\nBaruah และ Mazumder [11] ทบทวนการประยุกต์ ML ร่วมกับ eNose ในด้านสุขภาพ เกษตรกรรม และสาขาที่เกี่ยวข้อง โดยสรุปว่า PCA และ SVM เป็นเทคนิคที่ใช้กันบ่อยในการจำแนกหรือการวิเคราะห์รูปแบบสัญญาณ แต่การ **regression สำหรับการประเมินความเข้มข้นเชิงตัวเลข** ยังต้องการการออกแบบ feature การแบ่งชุดข้อมูล และการสอบเทียบกับวิธีอ้างอิงอย่างเป็นระบบ [11]\n\nงานเฉพาะทาง CH₄ แสดงให้เห็นศักยภาพของ ML calibration: Andrews et al. [23] นำเสนอการใช้ ML สอบเทียบเซ็นเซอร์ก๊าซสำหรับการติดตาม methane emissions Mitchell et al. [28] สาธิตการ calibration เซ็นเซอร์ Figaro ต้นทุนต่ำด้วย ML ในสภาพพีตบ่อน ซึ่งใกล้เคียงบริบทภาคสนาม Domènech-Gil et al. [10] ใช้ **Partial Least Squares Regression (PLSR)** กับ feature จากสัญญาณ TGS ร่วมกับค่าสภาพแวดล้อม ให้ผล quantification ที่ดีในช่วง ppb–ppm\n\nสำหรับการเลือกแบบจำลอง regression Lakhmi et al. [29] เปรียบเทียบ **linear กับ non-linear models** บน gas sensor array ที่มี CH₄ เป็นหนึ่งในก๊าซเป้าหมาย ซึ่งมีความเกี่ยวข้องโดยตรงกับงานวิจัยนี้ที่เริ่มจาก **log-linear regression** แล้วเปรียบเทียบกับ random forest งานล่าสุดใช้ deep learning บน time-series เช่น TFA-CNN [30] และ graph neural networks [31] สำหรับ concentration prediction แต่ความซับซ้อนและความต้องการข้อมูลมักสูงกว่า linear models\n\nจาก Zhang et al. [13] ในบริบทนาข้าว ML สามารถ invert ค่า CH₄ จากปัจจัยสิ่งแวดล้อมได้ แต่ใช้ตัวแปรดิน–น้ำ ไม่ใช่สัญญาณ breath sample จาก MOS งานวิจัยนี้จึงมุ่งเติมช่องว่างโดยใช้ **feature จากสัญญาณ eNose** (เช่น delta จาก baseline, ratio, slope) ร่วมกับค่า T/H/P จาก BME280 เพื่อทำนายความเข้มข้น CH₄ (ppm) [10], [29]\n\n---\n\n## 4.2.6 ช่องว่างทางวิจัย\n\nจากการทบทวนข้างต้น งานวิจัยที่เกี่ยวข้องสามารถสรุปเป็นสามสายหลักที่ยัง **ไม่ถูกบูรณาการในงานเดียว**:\n\n| สายงาน | ตัวอย่างงาน | สิ่งที่ทำได้ | สิ่งที่ยังขาด |\n|--------|-------------|-------------|--------------|\n| eNose + ML + CH₄ | Domènech-Gil [10] | quantify CH₄ ภาคสนาม, R²≈0.91 | ไม่ใช่บริบทนาข้าวไทย |\n| เซ็นเซอร์ MOS + นาข้าว | Rajasekar [5] | TGS2611/MQ4 ในแปลงนา | ไม่ใช่ eNose array + ML → ppm |\n| ML + CH₄ นาข้าว | Zhang [13] | in-situ CH₄, R²=0.84 | ไม่ใช้สัญญาณ MOS/eNose |\n\nสรุปช่องว่างทางวิจัยมีดังนี้:\n\n1. **ยังไม่พบงาน peer-reviewed ที่รวม eNose (MOS array) + ML regression + การให้ค่าความเข้มข้น CH₄ (ppm) ในนาข้าวแบบ end-to-end** พร้อม validate เทียบ chamber–GC\n2. วิธี chamber–GC [6], [7] ให้ความน่าเชื่อถือสูงแต่ **ไม่เหมาะกับการติดตามต่อเนื่อง** ในระดับแปลงนา\n3. วิธีสเปกโทรสโกปีและดาวเทียม [8], [22] ให้ความครอบคลุมระดับภูมิภาคแต่ **ต้นทุนสูงและความละเอียดเชิงพื้นที่ไม่ถึงรายแปลง**\n4. งาน eNose+ML ส่วนใหญ่ยังเน้น **การพิสูจน์แนวคิดหรือห้องแล็บ** มากกว่าการสร้างแบบจำลอง regression ที่นำไปใช้ในแปลงจริงได้อย่างต่อเนื่อง [10], [11]\n\nงานวิจัยนี้จึงมุ่งเติมช่องว่างดังกล่าว โดยพัฒนาระบบ eNose บนแพลตฟอร์ม Raspberry Pi ใช้เซ็นเซอร์ MOS ต้นทุนต่ำ (TGS2611/MQ4) อ่านผ่าน ADC ความละเอียดสูง ควบคู่ BME280 สร้างแบบจำลอง ML ที่ชดเชยผลจากอุณหภูมิ ความชื้น และความดัน และประเมินความแม่นยำเทียบกับ GC-FID ภายใต้ขอบเขตการศึกษาที่กำหนด [5], [6], [10]\n\n---\n\n## บรรณานุกรม\n\nรูปแบบ: `[#] Author (Year). Title. *Journal*. DOI — `docs/paper/...`\n\n### นาข้าว / CH₄ (`methane/`)\n\n**[4]** H. Nguyen et al. (2023). Carbon Footprint Reduction from Closing Rice Yield Gaps. In *Carbon Footprint of Rice Production*, pp. 149–176. — `methane/2023_Nguyen_carbon_footprint_rice_yield_gaps_mitigation.pdf`\n\n**[13]** Q. Zhang et al. (2025). Machine learning-driven method for i gricultural GHG. *Carbon Manage.*, 15(1). — `methods-chamber-gc/2024_Mumu_methodological_progress_agricultural_GHG.pdf`\n\n**[8]** L. Tyagi et al. (2025). Environmental impacts and recent advancements in the sensing of methane. *Environ. Technol. Rev.*, 14(1), 191–212. — `methods-spectroscopy/2025_Tyagi_methane_sensing_environmental_review.pdf`\n\n**[9]** M. S. Borhan & M. M. Khanaum (2022). Sensors and methods for measuring GHG from livestock facilities. *J. Geosci. Environ. Prot.*, 10(12), 242–272. — `methods-chamber-gc/2022_Borhan_sensors_methods_GHG_livestock.pdf`\n\n**[21]** (2022). TGA vs GC for methane in agricultural soils. — `methods-spectroscopy/2022_Vo_TGA_vs_GC_methane_agricultural_soils.pdf`\n\n**[22]** (2025). AI/ML methane rice remote sensing. — `methods-remote/2025_Xu_AI_ML_methane_rice_remote_sensing.pdf`\n\n### eNose (`enose/`)\n\n**[10]** G. Domènech-Gil et al. (2024). Electronic nose for improved environmental methane monitoring. *Environ. Sci. Technol.*, 58(1), 352–361. https://doi.org/10.1021/acs.est.3c06945 — `enose/2024_Domenech-Gil_eNose_environmental_methane_monitoring.pdf`\n\n**[12]** A. Ahmad et al. (2026). The Promise of Low-Cost MOS Gas Sensors for Precision Agriculture. *Adv. Sensor Res.* — `enose/2026_Ahmad_MOS_sensors_precision_agriculture.pdf`\n\n**[24]** Z. Ye et al. (2021). Recent Progress in Smart E-Nose Technologies with ML. *Sensors*, 21(22), 7620. — `enose/2021_Ye_smart_eNose_machine_learning_review.pdf`\n\n**[25]** J. Yin et al. (2023). Rapid identification of CH₄/CO mixtures based on eNose. *Sensors*, 23(6), 2975. — `enose/2023_Yin_eNose_CH4_CO_mixed_gas_identification.pdf`\n\n**[26]** D. Dobrzyniewski et al. (2021). Gas sensor array for methane reforming monitoring. *Sensors*, 21(15), 4983. — `enose/2021_Dobrzyniewski_TGS_sensor_array_methane_reforming.pdf`\n\n**[27]** (2023). MOS chemiresistive methane gas sensor (review). — `enose/2023_MOS_chemiresistive_methane_sensor_review.pdf`\n\n### Algorithm (`algorithm/`)\n\n**[11]** S. Baruah & D. H. Mazumder (2025). ML Techniques Coupled With E-Nose in Healthcare, Agriculture and Allied Domains. *IEEE Access*. — `algorithm/2025_Baruah_ML_eNose_healthcare_agriculture_review.pdf`\n\n**[23]** B. Andrews et al. (2023). ML for calibrating gas sensors for methane emissions. *Sensors*, 23(24), 9898. — `algorithm/2023_Andrews_ML_calibrating_gas_sensors_methane_emissions.pdf`\n\n**[28]** H. L. Mitchell et al. (2024). Calibration of a low-cost methane sensor using ML. *Sensors*, 24(4), 1066. — `algorithm/2024_Mitchell_Figaro_lowcost_methane_ML_calibration.pdf`\n\n**[29]** R. Lakhmi et al. (2024). Linear and non-linear modelling for gas sensor array (CH₄). *Sensors*, 24(11), 3499. — `algorithm/2024_Lakhmi_linear_nonlinear_gas_sensor_array_CH4.pdf`\n\n**[30]** M. Jiang et al. (2024). TFA-CNN for gas classification and concentration prediction. *Sensors*, 24(13), 4126. — `algorithm/2024_Jiang_TFA-CNN_gas_classification_concentration_prediction.pdf`\n\n**[31]** D. Wang et al. (2024). Graph-driven models for gas mixture concentration estimation. *arXiv:2412.13891*. — `algorithm/2024_Wang_graph_models_gas_mixture_concentration_estimation.pdf`\n", "meta": {"n": 56, "n_direct": 22, "n_supporting": 31, "n_excluded": 3, "n_pdf": 22, "lit_source": "D:/year 5/coding project/eNose/eNose_methane/eNose_methane/docs/paper/literature-review-4.2.md"}}</script>
<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
let activeStem = null;
let viewMode = 'paper';

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hasPdf(p) { return (p.files || []).some(f => f.ext === '.pdf'); }
function doiUrl(p) {
  if (p.doi) return 'https://doi.org/' + p.doi;
  return p.url || '';
}

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const tiers = new Set([...document.querySelectorAll('#filters input:checked')].map(i => i.dataset.tier));
  return DATA.papers.filter(p => {
    if (!tiers.has(p.tier)) return false;
    if (!q) return true;
    const blob = [p.title, p.authors, p.authors_full, p.year, p.doi, p.stem, p.journal, p.screen_id, p.reason, ...(p.tags||[])].join(' ').toLowerCase();
    return blob.includes(q);
  });
}

function renderList() {
  const items = filtered();
  const list = document.getElementById('list');
  list.innerHTML = items.map(p => `
    <button class="card ${p.stem === activeStem ? 'active' : ''}" data-stem="${esc(p.stem)}">
      <div class="meta">
        <span class="badge ${esc(p.tier)}">${esc(p.tier)}</span>
        ${p.screen_id ? `<span class="badge id">${esc(p.screen_id)}</span>` : ''}
        ${hasPdf(p) ? '<span class="badge pdf">PDF</span>' : ''}
        <span style="font-size:0.72rem;color:var(--muted)">${esc(p.year)}</span>
      </div>
      <div class="title">${esc(p.title)}</div>
      <div class="sub">${esc(p.authors || '—')}</div>
    </button>`).join('') || '<div class="empty" style="padding:1rem">ไม่พบรายการ</div>';
  document.getElementById('stats').textContent =
    `แสดง ${items.length} / ${DATA.papers.length} · PDF ${DATA.meta.n_pdf} เรื่อง · direct ${DATA.meta.n_direct} · supporting ${DATA.meta.n_supporting}`;
  list.querySelectorAll('.card').forEach(btn => {
    btn.addEventListener('click', () => {
      activeStem = btn.dataset.stem;
      viewMode = 'paper';
      syncTabs();
      renderList();
      renderView();
    });
  });
}

function mdLite(src) {
  let t = esc(src);
  t = t.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  t = t.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/^(?!<h\d|<blockquote|<ul|<li)(.+)$/gm, (m, p1) => {
    if (!p1.trim()) return '';
    if (p1.startsWith('<')) return p1;
    return '<p>' + p1 + '</p>';
  });
  return t;
}

function renderPaper(p) {
  if (!p) return '<div class="empty">เลือก paper จากรายการด้านซ้าย</div>';
  const files = p.files || [];
  const pdfs = files.filter(f => f.ext === '.pdf');
  const others = files.filter(f => f.ext !== '.pdf');
  const extract = DATA.extracts[p.stem];
  const link = doiUrl(p);
  return `
    <div class="paper-head">
      <div class="meta" style="margin-bottom:0.5rem">
        <span class="badge ${esc(p.tier)}">${esc(p.tier)}</span>
        ${p.screen_id ? `<span class="badge id">${esc(p.screen_id)}</span>` : ''}
        ${(p.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
      </div>
      <h2>${esc(p.title)}</h2>
      <p class="byline">${esc(p.authors_full || p.authors || '—')}${p.year ? ' · ' + esc(p.year) : ''}${p.journal ? ' · ' + esc(p.journal) : ''}</p>
    </div>
    <div class="actions">
      ${pdfs.map(f => `<a class="btn primary" href="${esc(f.path)}" target="_blank">เปิด PDF · ${esc(f.name)}</a>`).join('')}
      ${link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">DOI / แหล่งต้นฉบับ</a>` : ''}
      ${p.bib ? `<a class="btn" href="${esc(p.bib)}" target="_blank">BibTeX</a>` : ''}
      ${others.map(f => `<a class="btn" href="${esc(f.path)}" target="_blank">${esc(f.name)}</a>`).join('')}
    </div>
    <dl class="kv">
      <dt>Stem</dt><dd><code>${esc(p.stem)}</code></dd>
      <dt>DOI</dt><dd>${p.doi ? esc(p.doi) : '—'}</dd>
      <dt>หลักฐาน</dt><dd>${esc(p.evidence || (hasPdf(p) ? 'มี PDF ในคลัง' : (files.length ? 'มีไฟล์ในคลัง' : 'metadata (bib) เท่านั้น')))}</dd>
    </dl>
    <div class="box">
      <h3>ทำไมเกี่ยวข้องกับโปรเจกต์ (จาก screening)</h3>
      <p>${esc(p.why_th || p.reason || 'ยังไม่มีบันทึก screening ที่จับคู่ได้ — ดู Literature Review หรือเปิด PDF/DOI')}</p>
    </div>
    <div class="box">
      <h3>สรุป / extract ในคลัง</h3>
      ${extract ? `<pre>${esc(extract)}</pre>` : '<p>ยังไม่มี extract ใน repo สำหรับเรื่องนี้ — อ่าน PDF (ถ้ามี) หรือดูแท็บ Literature Review สำหรับบริบทสังเคราะห์</p>'}
    </div>`;
}

function renderAbout() {
  const m = DATA.meta;
  return `
    <h2 style="font-family:var(--serif);margin-top:0">เกี่ยวกับหน้านี้</h2>
    <p>หน้า HTML เดียวสำหรับอ่านคลัง <code>docs/paper/screened/</code> ของวิทยานิพนธ์ eNose–ML วัด CH₄ ในนาข้าว</p>
    <ul>
      <li>รายการ ${m.n} เรื่อง จาก BibTeX (direct ${m.n_direct} · supporting ${m.n_supporting} · excluded ${m.n_excluded})</li>
      <li>มี PDF ในคลัง ${m.n_pdf} เรื่อง</li>
      <li>เหตุผลคัดกรองดึงจาก <code>project-relevance-screening.md</code></li>
      <li>แท็บ Literature Review ดึงจาก <code>${esc(m.lit_source)}</code></li>
    </ul>
    <p style="color:var(--muted);font-size:0.9rem">เปิดไฟล์นี้ด้วยเบราว์เซอร์ (file://) จากโฟลเดอร์ screened เพื่อให้ลิงก์ PDF/bib ทำงาน — ไม่ต้องรันเซิร์ฟเวอร์</p>`;
}

function syncTabs() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === viewMode));
}

function renderView() {
  const view = document.getElementById('view');
  if (viewMode === 'lit') {
    view.className = 'view lit';
    view.innerHTML = mdLite(DATA.lit_md);
    return;
  }
  if (viewMode === 'about') {
    view.className = 'view';
    view.innerHTML = renderAbout();
    return;
  }
  view.className = 'view';
  const p = DATA.papers.find(x => x.stem === activeStem) || filtered()[0];
  if (p && !activeStem) activeStem = p.stem;
  view.innerHTML = renderPaper(p);
}

document.getElementById('q').addEventListener('input', () => { renderList(); if (viewMode==='paper') renderView(); });
document.querySelectorAll('#filters input').forEach(i => i.addEventListener('change', () => {
  i.parentElement.classList.toggle('on-' + i.dataset.tier, i.checked);
  renderList();
}));
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  viewMode = t.dataset.view;
  syncTabs();
  renderView();
}));

renderList();
renderView();
</script>
</body>
</html>
