<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>eNose Methane — Screened Papers Reader</title>
<style>
:root {
  --bg: #f7f4ef;
  --panel: #fffdf9;
  --ink: #1c1917;
  --muted: #78716c;
  --line: #e7e0d5;
  --accent: #0f766e;
  --accent-soft: #ccfbf1;
  --direct: #0f766e;
  --supporting: #a16207;
  --excluded: #b91c1c;
  --side: 320px;
  --serif: "IBM Plex Serif", "Sarabun", Georgia, serif;
  --sans: "IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: var(--side) 1fr; height: 100vh; }
.side {
  border-right: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0;
}
.brand { padding: 1.1rem 1rem 0.6rem; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 1.05rem; font-family: var(--serif); letter-spacing: -0.02em; }
.brand p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
.controls { padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); display: grid; gap: 0.5rem; }
.controls input[type=search] {
  width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; font: inherit;
}
.filters { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.filters label {
  font-size: 0.75rem; padding: 0.25rem 0.55rem; border-radius: 999px;
  border: 1px solid var(--line); background: #fff; cursor: pointer; user-select: none;
}
.filters label.on-direct { background: #ecfdf5; border-color: #99f6e4; color: var(--direct); }
.filters label.on-supporting { background: #fffbeb; border-color: #fde68a; color: var(--supporting); }
.filters label.on-excluded { background: #fef2f2; border-color: #fecaca; color: var(--excluded); }
.list { overflow: auto; flex: 1; padding: 0.4rem; }
.card {
  width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
  border-radius: 10px; padding: 0.7rem 0.75rem; cursor: pointer; font: inherit; color: inherit;
}
.card:hover { background: #f5f1ea; }
.card.active { background: var(--accent-soft); border-color: #99f6e4; }
.card .meta { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.25rem; flex-wrap: wrap; }
.badge {
  font-size: 0.68rem; font-weight: 600; padding: 0.12rem 0.4rem; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.03em;
}
.badge.direct { background: #ccfbf1; color: var(--direct); }
.badge.supporting { background: #fef3c7; color: var(--supporting); }
.badge.excluded { background: #fee2e2; color: var(--excluded); }
.badge.pdf { background: #e0e7ff; color: #3730a3; }
.badge.id { background: #f5f5f4; color: #44403c; }
.card .title { font-size: 0.86rem; line-height: 1.35; font-weight: 600; }
.card .sub { margin-top: 0.2rem; font-size: 0.75rem; color: var(--muted); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 0.25rem; padding: 0.65rem 1rem 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab {
  border: 0; background: transparent; padding: 0.55rem 0.85rem; border-radius: 8px 8px 0 0;
  font: inherit; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.view { overflow: auto; padding: 1.25rem 1.5rem 3rem; flex: 1; }
.empty { color: var(--muted); padding: 2rem 0; }
.paper-head h2 { margin: 0 0 0.4rem; font-family: var(--serif); font-size: 1.45rem; line-height: 1.3; }
.paper-head .byline { color: var(--muted); margin: 0 0 1rem; font-size: 0.92rem; }
.kv { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.35rem 0.75rem; margin: 1rem 0 1.25rem; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.box {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 1rem 1.1rem; margin: 0.9rem 0;
}
.box h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
.box p, .box pre { margin: 0; white-space: pre-wrap; line-height: 1.55; font-size: 0.92rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0 0.25rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.75rem;
  border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  text-decoration: none; font-size: 0.85rem;
}
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.tagrow { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
.tag { font-size: 0.72rem; padding: 0.15rem 0.45rem; border-radius: 6px; background: #f5f5f4; color: #57534e; }
.lit h1, .lit h2, .lit h3 { font-family: var(--serif); }
.lit h1 { font-size: 1.4rem; }
.lit h2 { font-size: 1.15rem; margin-top: 1.6rem; border-top: 1px solid var(--line); padding-top: 1rem; }
.lit h3 { font-size: 1rem; }
.lit p { line-height: 1.65; }
.lit blockquote { border-left: 3px solid var(--accent); margin: 0.8rem 0; padding: 0.2rem 0.8rem; color: var(--muted); }
.lit code { font-size: 0.85em; background: #f5f5f4; padding: 0.05rem 0.3rem; border-radius: 4px; }
.stats { font-size: 0.75rem; color: var(--muted); padding: 0.5rem 1rem; border-top: 1px solid var(--line); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>Screened Papers</h1>
      <p>คลังอ้างอิง eNose–CH₄ นาข้าว · อ่านสรุป + lit review</p>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="ค้นชื่อ / ผู้แต่ง / ปี / DOI / stem…" autocomplete="off"/>
      <div class="filters" id="filters">
        <label class="on-direct"><input type="checkbox" data-tier="direct" checked/> direct</label>
        <label class="on-supporting"><input type="checkbox" data-tier="supporting" checked/> supporting</label>
        <label class="on-excluded"><input type="checkbox" data-tier="excluded" checked/> excluded</label>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="stats" id="stats"></div>
  </aside>
  <main class="main">
    <div class="tabs">
      <button class="tab active" data-view="paper">รายเรื่อง</button>
      <button class="tab" data-view="lit">Literature Review</button>
      <button class="tab" data-view="about">เกี่ยวกับ</button>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>

ms Using an SMOTE-Augmented Machine Learning Framework", "authors": "Minqiang Li et al.", "authors_full": "Li, Minqiang and Wu, Chenxi and Wang, Zhiyang and Wu, Zhijian and Huang, Wei and Chen, Junru and Yu, Kaibo and Wen, Ting and Yin, Hongbo and Wang, Zhuqing", "year": "2026", "doi": "10.3390/s26020714", "journal": "Sensors", "url": "http://dx.doi.org/10.3390/s26020714", "files": [], "bib": "excluded/cite/2024_enhanced_gas_classification_SMOTE_ML_eNose.bib", "screen_id": "E03", "reason": "เป็น classification/imbalance framework ทั่วไป ไม่ใช่ concentration regression และ metadata ไม่ระบุ CH₄, paddy field หรือ transferable calibration", "evidence": "Metadata-only", "why_th": "เป็น classification/imbalance framework ทั่วไป ไม่ใช่ concentration regression และ metadata ไม่ระบุ CH₄, paddy field หรือ transferable calibration", "tags": []}], "extracts": {"2025_Zhang_ML_in-situ_CH4_measurement_paddy_fields_Yangtze": "# Zhang et al. (2025) — structured extract (no OA PDF available)\n# DOI: 10.1016/j.jenvman.2025.127132\n# PubMed: 40884954\n# Note: Former file 2025_Zhang_ML_in-situ_CH4_measurement_paddy_fields_Yangtze.pdf was MISFILED\n#       (actually Basheer et al. 2024, Sustainability 16, 4789). Renamed to _MISFILED_Basheer2024_GHG_agricultural_soil.pdf\n\nTITLE\nMachine learning-driven method for in-situ high-frequency CH4 measurement in paddy fields based on water-soil-air factors: A case study of the Yangtze River Basin\n\nAUTHORS\nQinjing Zhang, Weijia Wen, Yanhua Zhuang, Liang Zhang, Limei Zhai, Sisi Li, Hongbin Liu, Yun Du\n\nJOURNAL\nJournal of Environmental Management, Volume 393, October 2025, Article 127132\n\nABSTRACT (PubMed / ScienceDirect)\nAccurate and high-frequency monitoring of methane (CH4) from rice paddies is crucial for effective carbon emission control but remains challenging due to fluctuant emissions and complex field environments. This study proposed a new in-situ high-frequency CH4 measurement method based on machine learning and sensor-measurable water-soil-air environment factors. The results show that:\n(1) soil and paddy water serve as critical media influencing CH4 production and transportation, with paddy water depth (Hpw), soil electrical conductivity (EC), and soil temperature (Ts) being significantly positively correlated with CH4 emission flux, while soil redox potential (Eh) had a negative effect (p \u003c 0.05).\n(2) The decision tree (DTR) showed the best accuracy for CH4 inversion, with soil factors being the optimal input group (R2 = 0.84), which was superior to water-soil (0.83), water-soil-air (0.55), and air-soil (0.45) groups; Eh, EC, soil pH, and Ts are the essential input variables (R2 \u003e 0.80).\n(3) Combining the immediacy of multi-sensor detection and the accuracy of machine learning, the new method demonstrates notable advantages in high frequency, high accuracy, synchronous multiparameter monitoring, and low cost. This method enables the real-time monitoring and control of CH4 emission from paddy fields, thereby offering new perspectives for CH4 monitoring in small water bodies (such as ditches, ponds, lakes, etc.).\n\nHIGHLIGHTS\n- Develop a new in-situ high-frequency CH4 measurement method for rice paddies.\n- The new method combines the advantages of sensor and decision tree algorithm.\n- Sensor-measured water-soil-air factors are selected to simulate CH4 emission.\n\nSTUDY AREA & DATA (ScienceDirect preview)\n- Experiment: June–September 2022 and 2024\n- Sites: Liuzhou village (112.62°E, 30.39°N), Qianjiang City; Wenan town (111.82°E, 30.53°N), Zhijiang City, Hubei Province, China\n- Context: Yangtze River Basin — largest paddy area in China (~68.7% of national rice area)\n- Two typical crop rotation systems\n\nMOTIVATION (Introduction summary)\n- Rice paddies ≈ 48% of agricultural CH4 emissions (flooded conditions)\n- CH4 processes: production, oxidation, transport — driven by soil properties, water/fertilizer management, tillage, climate\n- Limitations of existing methods:\n  * Chamber: labor-intensive, low temporal resolution\n  * Models (CH4MOD, DNDC): complex calibration, limited temporal resolution\n  * Remote sensing: cloud/rain gaps during rice season (Jun–Oct)\n- Proposed: sensor immediacy + ML accuracy for CH4 monitoring\n\nKEY FINDINGS — factor relevance\n- Paddy water depth and soil EC significantly positively correlated with CH4 flux\n- Soil Eh negatively correlated\n- Soil + paddy surface water are critical for CH4 production and transport\n\nML COMPARISON\n- Five ML algorithms evaluated; Decision Tree Regressor (DTR) best\n- Input groups (R2):\n  * Soil only: 0.84 (best)\n  * Water-soil: 0.83\n  * Water-soil-air: 0.55\n  * Air-soil: 0.45\n- Key variables: Eh, EC, soil pH, Ts (each R2 \u003e 0.80 when used individually)\n\nCONCLUSION (ScienceDirect preview)\nAmong five evaluated ML algorithms, DTR exhibited highest accuracy (R2 = 0.84) with soil factors as input. Emphasizes critical roles of soil and paddy surface water; Eh, EC, soil pH, and Ts are essential.\n\nFUNDING\n- National Key R&D Program of China [2022YFD1700700]\n- Hubei Provincial Natural Science Foundation [2024AFA020]\n- Young Top-notch Talent Cultivation Program of Hubei Province\n\nKEYWORDS\nIn-situ monitoring; Machine learning; Methane (CH4); Paddy fields; Water-soil-air environment factors\n", "2024_IoT_lowcost_GHG_monitoring_paddy_regions": "# Metadata (PDF not downloaded automatically)\n\n**File:** `2024_IoT_lowcost_GHG_monitoring_paddy_regions.pdf`\n**Category:** methane\n**Year:** 2024\n\n**Title:** IoT Low-Cost GHG Monitoring in Paddy-Dominated Regions\n\n- PubMed: https://pubmed.ncbi.nlm.nih.gov/39467424/\n\nOpen manually via links above if institutional access is required.", "2024_Zhou_paddy_methane_emissions_Monsoon_Asia_review": "# Metadata (PDF not downloaded automatically)\n\n**File:** `2024_Zhou_paddy_methane_emissions_Monsoon_Asia_review.pdf`\n**Category:** methane\n**Year:** 2024\n\n**Title:** Paddy Rice Methane Emissions across Monsoon A :** methane\n**Year:** 2024\n\n**Title:** Diurnal Variation in Methane Emission from Rice Paddy (ebullition)\n\n- DOI: https://doi.org/10.1111/gcb.17345\n- PubMed: https://pubmed.ncbi.nlm.nih.gov/38418922/\n\nOpen manually via links above if institutional access is required."}, "lit_md": "# 4.2 สรุปสาระสำคัญจากงานวิจัยที่เกี่ยวข้อง\n\n\u003e เลขอ้างอิง `[n]` เป็นรายการรวมกับ §4.1 ตาม `[../proposal-4.1-4.2-cites-draft6.md](../proposal-4.1-4.2-cites-draft6.md)`  \n\u003e โทนร้อยแก้วอ้างอิงแบบเสนอ `[Proposal draft 6.pdf](./Proposal%20draft%206.pdf)` และหลักฐานจากคลัง `docs/paper/screened/`\n\nส่วนนี้สรุปสาระสำคัญจากงานวิจัยที่เกี่ยวข้องกับวิทยานิพนธ์ โดยจัดตามสี่แกนหลักตามแบบเสนอ ได้แก่ การปล่อย CH₄ จากนาข้าว วิธีวัดอ้างอิง chamber–GC วิธีวัดทางเลือกอื่น และเทคโนโลยี eNose ร่วมกับ ML จากนั้นปิดท้ายด้วยช่องว่างที่งานนี้จะเติม ควรแยกตั้งแต่ต้นว่าค่าในสายเซ็นเซอร์และแบบจำลองส่วนใหญ่เป็นความเข้มข้น (ppm หรือ ppb) ขณะที่งานนาข้าวจำนวนมากรายงานฟลักซ์เป็นมวลต่อพื้นที่ต่อเวลา\n\n---\n\n\n\n## 4.2.1 การปล่อยก๊าซมีเทนจากนาข้าวและปัจจัยควบคุม\n\nการปลูกข้าวแบบน้ำขังทำให้ดินอยู่ในสภาวะขาดออกซิเจน ซึ่งเอื้อต่อการเจริญของจุลินทรีย์กลุ่มสร้างมีเทน (methanogens) ในการย่อยสลายอินทรียวัตถุและปล่อยก๊าซมีเทน (CH₄) ออกสู่บรรยากาศ ทั้งผ่านผิวน้ำ ฟองอากาศ และผ่านระบบลำเลียงอากาศในต้นข้าว [4] ด้วยเหตุนี้นาข้าวจึงเป็นหนึ่งในแหล่งปล่อย CH₄ จากกิจกรรมของมนุษย์ที่สำคัญ งานทบทวนในภูมิภาคเอเชีย ประเมินว่าการปลูกข้าวมีส่วนสำคัญต่อการปล่อยมีเทนระดับภูมิภาค และชี้ตัวแปรควบคุมหลักด้านน้ำ ดิน และฤดูกาล [13] เมื่อพิจารณาว่าส่วนใหญ่ของข้าวโลกถูกผลิตและบริโภคในทวีปเอเชีย ภูมิภาคนี้จึงมีความสำคัญต่อการลดการปล่อยก๊าซจากระบบนา [13]\n\nอย่างไรก็ตาม ปริมาณการปล่อย CH₄ จากนาข้าวไม่ใช่ค่าคงที่ แต่ผันแปรตามการจัดการน้ำ พันธุ์ข้าว คุณสมบัติดิน และฤดูกาล จากการศึกษาของ Nguyen et al. [4] สรุปว่าการปล่อย CH₄ และไนตรัสออกไซด์ (N₂O) จากพื้นที่นาขึ้นอยู่กับรูปแบบการจัดการการปลูกเป็นหลัก ในบรรดาปัจจัยเหล่านี้ การจัดการน้ำให้ผลที่ชัดเจน โดยงานวิจัยของ  Anapalli et al. [16] ที่วัดการปล่อยก๊าซด้วยเทคนิค eddy covariance ยืนยันว่าวิธีการปลูกแบบ alternate wetting and drying (AWD) สามารถลดการปล่อย CH₄ ได้เฉลี่ย ร้อยละ 64.5 ± 12.3 เมื่อเทียบกับการขังน้ำต่อเนื่องได้ในทิศทางเดียวกัน แม้ขนาดผลจะขึ้นกับเงื่อนไขแปลง\n\nนอกจากการจัดการน้ำแล้ว ปัจจัยทางดินและชีวภาพก็มีบทบาท งานที่ศึกษาเกี่ยวกับรากของต้นข้าวชี้ว่าการพัฒนารากและสภาพดินรอบรากส่งผลต่ออัตราการปล่อย CH₄ [17] ขณะที่ปริมาณคาร์บอนที่ใช้ได้ (carbon availability) และค่า pH ของดินเป็นตัวควบคุมสำคัญของการปล่อยตามการเปลี่ยนแปลงอุณหภูมิเฉลี่ยรายปี [18] ในอีกมิติหนึ่ง Yang et al. [19] วิเคราะห์ภาพรวมจากหลายชุดข้อมูลที่ได้จากภาคสนาม พบว่าประสิทธิผลของปุ๋ยไนโตรเจนแบบ enhanced-efficiency มีผลต่อการลด CH₄ ขึ้นกับพันธุ์ข้าว เช่น การใช้ inhibitor ลด CH₄ ได้ ร้อยละ 23.6 ในพันธุ์ไฮบริด เทียบกับเพียง ร้อยละ 8.2 ในพันธุ์อินเบรด และลดได้สูงสุดถึงร้อยละ 40.6 ในรอบเก็บเกี่ยวที่สอง และขั้นตอนการปลูกอย่างชัดเจน  ตัวเลขเหล่านี้ยืนยันว่าพันธุ์ข้าวและวิธีการปลูกไม่ได้มีผลต่อการปล่อยโดยตรงเพียงอย่างเดียว แต่ยังกำหนดว่ามาตรการลดก๊าซจะได้ผลมากน้อยเพียงใดภายใต้เงื่อนไขจริง\n\nเพื่อประมาณการปล่อยในระดับภูมิภาค จึงมีการพัฒนาแบบจำลองเชิงกระบวนการ เช่น CH4MOD [20] แต่การประมาณระดับมหาภาคยังให้ความละเอียดไม่เพียงพอต่อการติดตามการเปลี่ยนแปลงในระดับแปลงนา เมื่อประกอบกับความผันผวนสูงทั้งตามฤดูกาล ระยะการเจริญเติบโตของข้าว และช่วงเวลาในแต่ละวัน [13] จึงสรุปได้ว่าการติดตามการปล่อย CH₄ เพื่อประเมินมาตรการลดก๊าซหรือเพื่อตรวจสอบความถูกต้องของเครื่องมือวัดใหม่ จำเป็นต้องอาศัยการวัดซ้ำที่ความถี่เพียงพอในระดับแปลงนา ไม่ใช่การสรุปจากค่าเฉลี่ยระดับภูมิภาคเพียงครั้งเดียว ซึ่งเป็นเหตุผลหลักที่ผลักดันความต้องการเครื่องมือวัดต้นทุนต่ำที่ติดตั้งภาคสนามได้\n\n---\n\n\n\n## 4.2.2 วิธีการวัดปริมาณก๊าซมีเทนแบบมาตรฐาน (Static Chamber ร่วมกับ GC)\n\nจากความต้องการข้อมูลระดับแปลงนาข้างต้น การใช้ห้องเก็บตัวอย่างแบบปิด (static chamber) ร่วมกับก๊าซโครมาโทกราฟี (GC) ยังคงเป็นวิธีอ้างอิงที่ได้รับการยอมรับกว้างขวางสำหรับการวัดฟลักซ์ของก๊าซเรือนกระจกจากดินเกษตรกรรม [6] หลักการคือครอบ chamber ลงบนผิวดินหรือผิวน้ำเป็นระยะเวลาหนึ่ง แล้วเก็บตัวอย่างอากาศภายในตามช่วงเวลา เพื่อคำนวณอัตราการสะสมความเข้มข้นของ CH₄ ต่อหน่วยพื้นที่ต่อเวลา (เช่น mg m⁻² h⁻¹) ก่อนนำไปวิเคราะห์ด้วย GC ในห้องปฏิบัติการ Zaman et al. [6] วางระเบียบวิธีมาตรฐานสำหรับการวัดก๊าซเรือนกระจกจากดินเกษตรด้วยเทคนิค non-isotopic ครอบคลุมตั้งแต่การออกแบบ chamber การเก็บตัวอย่าง จนถึงการวิเคราะห์ด้วย GC โดยทั่วไป chamber แบบเก็บ vial ด้วยมือจะครอบประมาณ 20–30 นาที และเก็บตัวอย่างหลายจุดเวลาเพื่อหาความชันของความเข้มข้น\n\nแม้วิธีนี้จะให้ความแม่นยำและความน่าเชื่อถือสูง แต่ข้อจำกัดหลักของ chamber–GC อยู่ที่ต้นทุนสูง การใช้แรงงานมาก และความถี่ในการเก็บตัวอย่างที่ต่ำ [7] โดยทั่วไปการเก็บตัวอย่างทำได้เพียงไม่กี่ครั้งต่อสัปดาห์ ทำให้เสี่ยงต่อการพลาดจับพลวัตการปล่อยแบบรายวันหรือเหตุการณ์ ebullition ที่เกิดขึ้นเป็นช่วง ๆ และติดตามการเปลี่ยนแปลงตลอดฤดูปลูกได้ยาก [7]\n\nจุดที่ต้องไม่สับสนสำหรับวิทยานิพนธ์นี้คือเป้าหมายสองอย่างไม่ใช่สิ่งเดียวกัน ฟลักซ์จาก chamber คำนวณจากความชันของความเข้มข้นต่อเวลาภายใต้ปริมาตรและพื้นที่ที่ทราบ ส่วนแบบจำลอง eNose ในงานนี้มุ่งประมาณความเข้มข้น CH₄ เป็น ppm โดยเทียบกับ GC-FID เป็น ground truth ภายใต้เงื่อนไขสุ่มตัวอย่างที่กำหนด Chamber–GC จึงเป็นมาตรฐานอ้างอิงสำหรับความเข้มข้นตอนฝึกและตรวจแบบจำลอง ไม่ใช่สิ่งที่ eNose จะมาแทนทั้งหมดในระเบียบวิธีฟลักซ์\n\n---\n\n\n\n## 4.2.3 วิธีการวัดปริมาณก๊าซมีเทนแบบอื่น ๆ\n\nนอกเหนือจาก chamber–GC ยังมีวิธีการวัดและประเมิน CH₄ จากนาข้าวอีกหลายแนวทาง แต่ละแบบมีจุดเด่นและข้อจำกัดต่างกันในมิติของความแม่นยำ ความละเอียดเชิงพื้นที่ ต้นทุน และความเหมาะสมกับการติดตามต่อเนื่อง\n\nเทคนิคสเปกโทรสโกปี เช่น Tunable Diode Laser Absorption Spectroscopy (TDLAS), Cavity Ring-Down Spectroscopy (CRDS) และ Fourier Transform Infrared Spectroscopy (FTIR) สามารถวัดความเข้มข้น CH₄ ได้ในระดับ ppm ถึง ppb พร้อมการตอบสนองที่รวดเร็ว และเหมาะกับงานในห้องปฏิบัติการหรือสถานีตรวจวัดคงที่ แต่มีต้นทุนสูง ต้องการการตั้งค่าที่ซับซ้อน และไม่คุ้มค่าต่อการติดตั้งหลายจุดในแปลงนาขนาดเล็ก [8] Vo et al. [21] เปรียบเทียบ laser-based Trace Gas Analyzer (TGA) กับ manual chamber–GC ในนาภายใต้ AWD และการขังน้ำต่อเนื่อง พบว่าทั้งสามวิธีให้ค่าฟลักซ์ CH₄ ใกล้เคียงกัน และระบบ TGA ช่วยเพิ่ม throughput การวัดได้ แต่ยังมีต้นทุนลงทุนสูง จึงยังไม่ใช่ทางเลือกต้นทุนต่ำสำหรับแปลงนาทั่วไป\n\nการสังเกตจากระยะไกลทั้งจากดาวเทียมและอากาศยานไร้คนขับครอบคลุมพื้นที่กว้างได้ แต่ความละเอียดเชิงพื้นที่มักไม่ลงลึกถึงระดับรายแปลงนา Xu et al. [22] นำเสนอการผสาน AI/ML เข้ากับข้อมูล remote sensing เพื่อประเมิน CH₄ จากนาข้าว ซึ่งเหมาะกับการประเมินระดับภูมิภาคมากกว่าการติดตามแบบเรียลไทม์ในแปลงเดียว นอกจากนี้เกณฑ์ตรวจจับของดาวเทียมปัจจุบันยังห่างจากอัตราปล่อยพื้นหลังของนาข้าวหลายระดับ ทำให้การประมาณจากระยะไกลยังต้องพึ่งการวัดภาคพื้นดินเป็น ground truth [21, 22]\n\nเซ็นเซอร์ก๊าซต้นทุนต่ำเป็นทางเลือกที่ใกล้เคียงกับงานวิจัยนี้มากที่สุด Rajasekar และ Selvi [5] พัฒนาระบบ chamber อัตโนมัติร่วมกับเซ็นเซอร์ราคาประหยัด MQ4 และ TGS2611 เพื่อวัด CH₄ จากนาข้าวสู่บรรยากาศใกล้ผิว ผลการทดลองแสดงว่าเซ็นเซอร์ต้นทุนต่ำสามารถติดตามแนวโน้มการปล่อยในภาคสนามได้จริง อย่างไรก็ตาม ค่าที่ได้ยังต้องสอบเทียบกับวิธีอ้างอิงอย่างสม่ำเสมอ และงานดังกล่าวใช้การแปลงค่าจากสูตรผู้ผลิตมากกว่าการใช้แบบจำลองการเรียนรู้ของเครื่องแบบหลายเซ็นเซอร์\n\nการประเมินด้วยการเรียนรู้ของเครื่องจากปัจจัยสิ่งแวดล้อมเป็นแนวทางล่าสุดในบริบทนาข้าว Zhang et al. [23] เสนอวิธีติดตาม CH₄ ที่ความถี่สูงโดยใช้ ML กับปัจจัยน้ำ–ดิน–อากาศในลุ่มแม่น้ำแยงซี โดยแบบจำลอง Decision Tree Regressor ให้ค่า R² สูงถึง 0.84 เมื่อใช้ปัจจัยดินเป็นตัวแปรนำเข้าในชุดที่รายงาน งานนี้ใกล้เคียงกับ use case ของงานวิจัยนี้มากในด้านการใช้ ML ทำนาย CH₄ ในนาข้าว แต่ยังไม่ได้ใช้สัญญาณจากเซ็นเซอร์ MOS/eNose เป็นตัวแปรหลัก จึงเปิดช่องว่างสำหรับการบูรณาการสัญญาณจมูกอิเล็กทรอนิกส์เข้ากับ ML โดยตรง\n\n---\n\n\n\n## 4.2.4 เทคโนโลยีจมูกอิเล็กทรอนิกส์และเทคนิคการเรียนรู้ของเครื่อง\n\nจมูกอิเล็กทรอนิกส์ (electronic nose, eNose) เป็นระบบที่เลียนแบบการรับกลิ่นของมนุษย์ ประกอบด้วยอาเรย์ของเซ็นเซอร์ก๊าซที่มีความเลือกจำเพาะบางส่วน ระบบเก็บสัญญาณ และซอฟต์แวร์วิเคราะห์รูปแบบ [24] เมื่อก๊าซเป้าหมายสัมผัสพื้นผิวเซ็นเซอร์ โดยเฉพาะเซ็นเซอร์ชนิดโลหะออกไซด์ (metal oxide semiconductor, MOS) ความต้านทานของวัสดุจะเปลี่ยนแปลงตามความเข้มข้นของก๊าซ สัญญาณรวมจากเซ็นเซอร์หลายตัวจึงกลายเป็นเวกเตอร์หลายมิติที่นำไปจำแนกชนิดหรือประเมินความเข้มข้นได้ Ye et al. [24] สรุปว่าการนำการเรียนรู้ของเครื่องมาใช้ทำให้ eNose ทำงานได้ทั้งเชิงคุณภาพและเชิงปริมาณ\n\nงานวิจัยของ Domènech-Gil et al. [10] พัฒนา eNose ต้นทุนต่ำสำหรับการติดตาม CH₄ ในบรรยากาศ โดยใช้เซ็นเซอร์ MOS หลายตัว (Figaro TGS2611) ควบคู่กับเซ็นเซอร์วัดอุณหภูมิ ความชื้น และความดัน แล้วใช้แบบจำลอง regression ชดเชยผลกระทบจากสภาพแวดล้อม ในห้องปฏิบัติการระบบให้ R² \u003e 0.9 และ RMSE \u003c 100 ppb ในช่วง 0–9 ppm CH₄ ส่วนในสภาพภาคสนามสามารถวัดได้ถึงระดับความเข้มข้นบรรยากาศ โดยให้ค่าความคลาดเคลื่อน RMSE ต่ำสุดถึง 33 ppb และค่า R² สูงสุดถึง 0.91 [10] ผลลัพธ์นี้แสดงถึงความเป็นไปได้ของแนวทาง eNose+ML สำหรับการประเมินปริมาณ CH₄ แต่ช่วงความเข้มข้นและบริบทยังต่างจากนาข้าวที่มีความชื้นสูงและสภาพแวดล้อมซับซ้อน จึงไม่สามารถนำแบบจำลองมาใช้โดยตรง ข้อจำกัดที่ปรากฏซ้ำในวรรณกรรมคือ cross-sensitivity ต่อความชื้น อุณหภูมิ และก๊าซรบกวนอื่น Ahmad et al. [12] อภิปรายศักยภาพของเซ็นเซอร์ MOS สำหรับ precision agriculture และเน้นว่าความไวต่อสารอินทรีย์ระเหยง่ายและการเปลี่ยนแปลงของสภาพแวดล้อมยังเป็นข้อจำกัดหลักที่ต้องชดเชยด้วยแบบจำลองหลายตัวแปร งานสนับสนุนอื่นในคลังยังแสดงความเป็นไปได้ของ MOS สำหรับมีเทน เช่น การออกแบบ eNose เพื่อจำแนก CH₄/CO ในก๊าซผสม และการทบทวนวัสดุ MOS chemiresistive สำหรับ CH₄ [25, 26]\n\nในด้าน field characterization ของ Figaro และเซ็นเซอร์ใกล้เคียง Furuta et al. เทียบ TGS2600, TGS2611 และ MQ4 ในช่วง ppm ต่ำใกล้พื้นหลัง และชี้ความชื้นกับอุณหภูมิเป็นปัญหาหลัก จากนั้นประเมินโหนดเซ็นเซอร์ต้นทุนต่ำสำหรับ near-background methane โดยรวมสัญญาณก๊าซกับอุณหภูมิ–ความชื้น Shah et al. วัดการตอบสนองของ TGS2611-E00 ต่อ CH₄ น้ำ และอุณหภูมิอย่างละเอียด และนำ TGS2611-C00 ไปประมาณ mole fraction ที่ landfill ร่วมทิศทางลม งานเหล่านี้ให้ฐานฮาร์ดแวร์ที่ใกล้โครงการ แต่ยังไม่ใช่บริบท chamber จากนาข้าวไทย\n\nในด้านการเรียนรู้ของเครื่อง Baruah และ Mazumder [11] ทบทวนการประยุกต์ ML ร่วมกับ eNose และสรุปว่าเทคนิค PCA และ SVM ถูกใช้บ่อยในงานจำแนกและวิเคราะห์รูปแบบ แต่การทำ regression เพื่อประเมินความเข้มข้นเชิงตัวเลขยังต้องการการออกแบบ feature การแบ่งชุดข้อมูล และการสอบเทียบกับวิธีอ้างอิงอย่างเป็นระบบ ในบริบทของ CH₄ โดยเฉพาะ Andrews et al. [27] ใช้ ML สอบเทียบเซ็นเซอร์ก๊าซสำหรับติดตาม methane emissions และ Mitchell et al. [28] สาธิตการสอบเทียบเซ็นเซอร์ Figaro ด้วย ML ในพื้นที่พรุ ซึ่งใกล้เคียงกับสภาพภาคสนามและให้ผลว่าแบบจำลองสามารถให้ค่า R² สูงในการสอบเทียบภายใต้เงื่อนไขที่ควบคุม Kiplimo et al. และงาน regression อื่นในคลัง screened ยังชี้ว่าการสอบเทียบเชิงเส้นอย่างเดียวอ่อนเมื่อความชื้นและอุณหภูมิรบกวน และแบบจำลองแบบต้นไม้หรือโครงข่ายประสาทอาจจับความสัมพันธ์จากความต้านทานกับตัวแปรสภาพแวดล้อมได้ดีกว่าในบางบริบท\n\nโดยสรุป วรรณกรรมชี้ตรงกันว่าการชดเชย cross-sensitivity ของ MOS ด้วยเซ็นเซอร์สภาพแวดล้อม (T/H/P) ร่วมกับ ML มีผลต่อความแม่นยำ [10, 12, 27] อย่างไรก็ตาม ยังไม่พบงานวิจัยในคลังที่รวมทั้งสามองค์ประกอบ ได้แก่ eNose แบบอาเรย์ MOS, ML regression ที่ให้ค่า ppm และบริบทของนาข้าวที่ validate เทียบ chamber–GC ไว้ในงานเดียวกัน งานวิจัยนี้จึงมุ่งพัฒนาระบบ eNose ต้นทุนต่ำที่ชดเชยผลของสิ่งแวดล้อมและทำนายความเข้มข้น CH₄ ได้ภายใต้ขอบเขตการศึกษาที่กำหนด โดยวางระบบเป็นเครื่องมือเสริม ไม่ใช่การทดแทน chamber–GC สำหรับรายงานฟลักซ์มาตรฐาน\n\nเรื่อง feature ของโครงการ เช่น ΔV จากเส้นฐาน ควรถือเป็นตัวเลือกเชิงวิศวกรรมที่ต้องเทียบกับอัตราส่วน ความชัน หรือลักษณะเชิงเวลาอื่น ไม่ใช่ฉันทามติของวรรณกรรม เพราะคลังยังไม่มีหลักฐานพอจะยึดว่านิยามดังกล่าวเป็นมาตรฐานสากล", "meta": {"n": 56, "n_direct": 22, "n_supporting": 31, "n_excluded": 3, "n_pdf": 22, "lit_source": "G:/Other computers/My Laptop/coding project/eNose/eNose_methane/eNose_methane/docs/draft/4.2-สรุปสาระสำคัญจากงานวิจัยที่เกี่ยวข้อง.md"}}</script>
<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
let activeStem = null;
let viewMode = 'paper';

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hasPdf(p) { return (p.files || []).some(f => f.ext === '.pdf'); }
function doiUrl(p) {
  if (p.doi) return 'https://doi.org/' + p.doi;
  return p.url || '';
}

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const tiers = new Set([...document.querySelectorAll('#filters input:checked')].map(i => i.dataset.tier));
  return DATA.papers.filter(p => {
    if (!tiers.has(p.tier)) return false;
    if (!q) return true;
    const blob = [p.title, p.authors, p.authors_full, p.year, p.doi, p.stem, p.journal, p.screen_id, p.reason, ...(p.tags||[])].join(' ').toLowerCase();
    return blob.includes(q);
  });
}

function renderList() {
  const items = filtered();
  const list = document.getElementById('list');
  list.innerHTML = items.map(p => `
    <button class="card ${p.stem === activeStem ? 'active' : ''}" data-stem="${esc(p.stem)}">
      <div class="meta">
        <span class="badge ${esc(p.tier)}">${esc(p.tier)}</span>
        ${p.screen_id ? `<span class="badge id">${esc(p.screen_id)}</span>` : ''}
        ${hasPdf(p) ? '<span class="badge pdf">PDF</span>' : ''}
        <span style="font-size:0.72rem;color:var(--muted)">${esc(p.year)}</span>
      </div>
      <div class="title">${esc(p.title)}</div>
      <div class="sub">${esc(p.authors || '—')}</div>
    </button>`).join('') || '<div class="empty" style="padding:1rem">ไม่พบรายการ</div>';
  document.getElementById('stats').textContent =
    `แสดง ${items.length} / ${DATA.papers.length} · PDF ${DATA.meta.n_pdf} เรื่อง · direct ${DATA.meta.n_direct} · supporting ${DATA.meta.n_supporting}`;
  list.querySelectorAll('.card').forEach(btn => {
    btn.addEventListener('click', () => {
      activeStem = btn.dataset.stem;
      viewMode = 'paper';
      syncTabs();
      renderList();
      renderView();
    });
  });
}

function mdLite(src) {
  let t = esc(src);
  t = t.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  t = t.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/^(?!<h\d|<blockquote|<ul|<li)(.+)$/gm, (m, p1) => {
    if (!p1.trim()) return '';
    if (p1.startsWith('<')) return p1;
    return '<p>' + p1 + '</p>';
  });
  return t;
}

function renderPaper(p) {
  if (!p) return '<div class="empty">เลือก paper จากรายการด้านซ้าย</div>';
  const files = p.files || [];
  const pdfs = files.filter(f => f.ext === '.pdf');
  const others = files.filter(f => f.ext !== '.pdf');
  const extract = DATA.extracts[p.stem];
  const link = doiUrl(p);
  return `
    <div class="paper-head">
      <div class="meta" style="margin-bottom:0.5rem">
        <span class="badge ${esc(p.tier)}">${esc(p.tier)}</span>
        ${p.screen_id ? `<span class="badge id">${esc(p.screen_id)}</span>` : ''}
        ${(p.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
      </div>
      <h2>${esc(p.title)}</h2>
      <p class="byline">${esc(p.authors_full || p.authors || '—')}${p.year ? ' · ' + esc(p.year) : ''}${p.journal ? ' · ' + esc(p.journal) : ''}</p>
    </div>
    <div class="actions">
      ${pdfs.map(f => `<a class="btn primary" href="${esc(f.path)}" target="_blank">เปิด PDF · ${esc(f.name)}</a>`).join('')}
      ${link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">DOI / แหล่งต้นฉบับ</a>` : ''}
      ${p.bib ? `<a class="btn" href="${esc(p.bib)}" target="_blank">BibTeX</a>` : ''}
      ${others.map(f => `<a class="btn" href="${esc(f.path)}" target="_blank">${esc(f.name)}</a>`).join('')}
    </div>
    <dl class="kv">
      <dt>Stem</dt><dd><code>${esc(p.stem)}</code></dd>
      <dt>DOI</dt><dd>${p.doi ? esc(p.doi) : '—'}</dd>
      <dt>หลักฐาน</dt><dd>${esc(p.evidence || (hasPdf(p) ? 'มี PDF ในคลัง' : (files.length ? 'มีไฟล์ในคลัง' : 'metadata (bib) เท่านั้น')))}</dd>
    </dl>
    <div class="box">
      <h3>ทำไมเกี่ยวข้องกับโปรเจกต์ (จาก screening)</h3>
      <p>${esc(p.why_th || p.reason || 'ยังไม่มีบันทึก screening ที่จับคู่ได้ — ดู Literature Review หรือเปิด PDF/DOI')}</p>
    </div>
    <div class="box">
      <h3>สรุป / extract ในคลัง</h3>
      ${extract ? `<pre>${esc(extract)}</pre>` : '<p>ยังไม่มี extract ใน repo สำหรับเรื่องนี้ — อ่าน PDF (ถ้ามี) หรือดูแท็บ Literature Review สำหรับบริบทสังเคราะห์</p>'}
    </div>`;
}

function renderAbout() {
  const m = DATA.meta;
  return `
    <h2 style="font-family:var(--serif);margin-top:0">เกี่ยวกับหน้านี้</h2>
    <p>หน้า HTML เดียวสำหรับอ่านคลัง <code>docs/paper/screened/</code> ของวิทยานิพนธ์ eNose–ML วัด CH₄ ในนาข้าว</p>
    <ul>
      <li>รายการ ${m.n} เรื่อง จาก BibTeX (direct ${m.n_direct} · supporting ${m.n_supporting} · excluded ${m.n_excluded})</li>
      <li>มี PDF ในคลัง ${m.n_pdf} เรื่อง</li>
      <li>เหตุผลคัดกรองดึงจาก <code>project-relevance-screening.md</code></li>
      <li>แท็บ Literature Review ดึงจาก <code>${esc(m.lit_source)}</code></li>
    </ul>
    <p style="color:var(--muted);font-size:0.9rem">เปิดไฟล์นี้ด้วยเบราว์เซอร์ (file://) จากโฟลเดอร์ screened เพื่อให้ลิงก์ PDF/bib ทำงาน — ไม่ต้องรันเซิร์ฟเวอร์</p>`;
}

function syncTabs() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === viewMode));
}

function renderView() {
  const view = document.getElementById('view');
  if (viewMode === 'lit') {
    view.className = 'view lit';
    view.innerHTML = mdLite(DATA.lit_md);
    return;
  }
  if (viewMode === 'about') {
    view.className = 'view';
    view.innerHTML = renderAbout();
    return;
  }
  view.className = 'view';
  const p = DATA.papers.find(x => x.stem === activeStem) || filtered()[0];
  if (p && !activeStem) activeStem = p.stem;
  view.innerHTML = renderPaper(p);
}

document.getElementById('q').addEventListener('input', () => { renderList(); if (viewMode==='paper') renderView(); });
document.querySelectorAll('#filters input').forEach(i => i.addEventListener('change', () => {
  i.parentElement.classList.toggle('on-' + i.dataset.tier, i.checked);
  renderList();
}));
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  viewMode = t.dataset.view;
  syncTabs();
  renderView();
}));

renderList();
renderView();
</script>
</body>
</html>
